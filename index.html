<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Local · Recreación 3D</title>
    <style>
      :root {
        --ink: #1c1a17;
        --panel: rgba(20, 18, 16, 0.82);
        --line: #3a352f;
        --accent: #8fd14f;
        --txt: #efe9df;
        --dim: #a89f92;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0e0d0c;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      #top h1 {
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--txt);
        font-weight: 600;
      }
      #top span {
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.05em;
      }
      #bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        background: linear-gradient(transparent, rgba(10, 9, 8, 0.85) 40%);
      }
      button {
        pointer-events: auto;
        background: var(--panel);
        color: var(--txt);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
      }
      button.on {
        background: var(--accent);
        color: #15240a;
        border-color: var(--accent);
      }
      #hint {
        position: fixed;
        bottom: 64px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.04em;
        pointer-events: none;
        transition: opacity 1s;
      }
      #joy {
        position: fixed;
        left: 16px;
        bottom: 110px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: rgba(20, 18, 16, 0.45);
        display: none;
        touch-action: none;
        z-index: 5;
      }
      #knob {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="top">
      <h1>Tu local · 3D</h1>
      <span>7 × 11 × 4,9 m</span>
    </div>
    <div id="hint">1 dedo: girar · 2 dedos: zoom</div>
    <div id="joy"><div id="knob"></div></div>
    <div id="bar">
      <button id="bGen" class="on">General</button>
      <button id="bSec">Lateral</button>
      <button id="bWalk">Paseo</button>
      <button id="bWall">Pared izq.</button>
      <button id="bPan" class="on">Paneles</button>
      <button id="bFac" class="on">Fachada</button>
      <button id="bBaj" class="on">Bajantes</button>
      <button id="bTub" class="on">Corrugados</button>
      <button id="bVid">Vidrios</button>
      <button id="bLab" class="on">Cotas</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ---------- dimensiones (m) ----------
      const W = 7,
        D = 11,
        H = 5; // ancho, fondo, altura total
      const CALLE = 1.4; // nivel calle sobre solera
      const MEZZ = 2.6; // planta nueva (+1,2 sobre calle)
      const MID = -5.5; // mitad del local (z)
      const GR = 0.18; // grosor forjados

      // ---------- escena ----------
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x141210);
      scene.fog = new THREE.Fog(0x141210, 18, 40);
      const cam = new THREE.PerspectiveCamera(55, 1, 0.1, 100);

      // ---------- texturas procedurales ----------
      function canvasTex(draw, w = 256, h = 256, rx = 1, ry = 1) {
        const cv = document.createElement("canvas");
        cv.width = w;
        cv.height = h;
        draw(cv.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(cv);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(rx, ry);
        return t;
      }
      function brickDraw(ctx, w, h) {
        ctx.fillStyle = "#cfc3ae";
        ctx.fillRect(0, 0, w, h);
        const bw = 42,
          bh = 16;
        for (let y = 0, r = 0; y < h; y += bh, r++) {
          for (let x = -bw; x < w + bw; x += bw) {
            const ox = ((r % 2) * bw) / 2;
            const v = 200 + Math.random() * 30,
              vr = v + Math.random() * 14;
            ctx.fillStyle = `rgb(${vr | 0},${(v * 0.82) | 0},${(v * 0.6) | 0})`;
            ctx.fillRect(x + ox + 1, y + 1, bw - 2, bh - 2);
          }
        }
      }
      function concreteDraw(ctx, w, h) {
        ctx.fillStyle = "#b9b2a6";
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 2500; i++) {
          const g = 160 + Math.random() * 60;
          ctx.fillStyle = `rgba(${g},${g - 4},${g - 10},.25)`;
          ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }
      }
      function ceilDraw(ctx, w, h) {
        ctx.fillStyle = "#9a948a";
        ctx.fillRect(0, 0, w, h);
        const bw = 30,
          bh = 58;
        for (let y = 2; y < h; y += bh)
          for (let x = 2; x < w; x += bw) {
            const g = 205 + Math.random() * 22;
            ctx.fillStyle = `rgb(${g | 0},${(g - 4) | 0},${(g - 12) | 0})`;
            ctx.beginPath();
            ctx.roundRect(x, y, bw - 5, bh - 6, 5);
            ctx.fill();
          }
      }
      const mBrick = (rx, ry) =>
        new THREE.MeshStandardMaterial({
          map: canvasTex(brickDraw, 256, 256, rx, ry),
          roughness: 0.95,
        });
      const mConc = new THREE.MeshStandardMaterial({
        map: canvasTex(concreteDraw, 256, 256, 3, 6),
        roughness: 0.9,
      });
      const mConcN = new THREE.MeshStandardMaterial({
        map: canvasTex(concreteDraw, 256, 256, 3, 3),
        color: 0xd8d2c6,
        roughness: 0.85,
      });
      const mCeil = new THREE.MeshStandardMaterial({
        map: canvasTex(ceilDraw, 256, 256, 3, 6),
        roughness: 0.95,
      });
      const mPilar = new THREE.MeshStandardMaterial({
        color: 0xc9c2b4,
        roughness: 0.9,
      });
      const mStep = new THREE.MeshStandardMaterial({
        color: 0x6b665e,
        roughness: 0.6,
        metalness: 0.3,
      });
      const mGlass = new THREE.MeshStandardMaterial({
        color: 0xaad4d8,
        transparent: true,
        opacity: 0.25,
        roughness: 0.1,
      });
      const mRail = new THREE.MeshStandardMaterial({
        color: 0x2e2b27,
        roughness: 0.5,
        metalness: 0.5,
      });

      const G = new THREE.Group();
      scene.add(G);
      function box(w, h, d, mat, x, y, z, parent = G) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        m.castShadow = m.receiveShadow = true;
        parent.add(m);
        return m;
      }

      // ---------- envolvente ----------
      const wallL = box(
        0.15,
        H,
        D,
        mBrick(6, 3),
        -W / 2 - 0.075,
        H / 2,
        -D / 2,
      );
      wallL.visible = false; // sección por defecto
      const wallR = box(0.15, H, D, mBrick(6, 3), W / 2 + 0.075, H / 2, -D / 2);
      box(W + 0.3, H, 0.15, mBrick(3, 3), 0, H / 2, -D - 0.075); // fondo
      box(W, 0.2, D, mConc, 0, -0.1, -D / 2); // solera original
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mCeil);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(0, H, -D / 2);
      G.add(ceil);
      // pilares como en las fotos: esquinas + centrales a mitad del local
      [
        [-W / 2 + 0.18, -0.1],
        [W / 2 - 0.18, -0.1],
        [-W / 2 + 0.18, MID],
        [W / 2 - 0.18, MID],
        [-W / 2 + 0.18, -D + 0.1],
        [W / 2 - 0.18, -D + 0.1],
      ].forEach((p) => box(0.36, H, 0.36, mPilar, p[0], H / 2, p[1]));
      // viga horizontal de la pared del fondo (como en las fotos)
      box(W, 0.4, 0.25, mPilar, 0, 2.5, -D + 0.13);

      // ---------- panelado a haces de pilares (oculta pilares; detrás, cámara de instalaciones) ----------
      const mPanel = new THREE.MeshStandardMaterial({
        color: 0xe8e1d3,
        roughness: 0.85,
      });
      const PIN = W / 2 - 0.38; // cara vista del panel, enrasada con los pilares
      const paneles = new THREE.Group();
      G.add(paneles);
      const panelL = box(
        0.06,
        H,
        D,
        mPanel,
        -PIN - 0.03,
        H / 2,
        -D / 2,
        paneles,
      );
      box(0.06, H, D, mPanel, PIN + 0.03, H / 2, -D / 2, paneles);
      box(W - 0.6, H, 0.06, mPanel, 0, H / 2, -(D - 0.38) - 0.03, paneles);

      // corrugados (naranja = eléctrico, gris = red/datos) sobre el ladrillo, dentro de la cámara
      const mTubE = new THREE.MeshStandardMaterial({
        color: 0xd9742a,
        roughness: 0.7,
      });
      const mTubR = new THREE.MeshStandardMaterial({
        color: 0x8d949c,
        roughness: 0.7,
      });
      const tubos = new THREE.Group();
      G.add(tubos);
      const tubosL = new THREE.Group();
      tubos.add(tubosL);
      function tubo(mat, len, x, y, z, horiz, parent = tubos) {
        const t = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.035, len, 8),
          mat,
        );
        if (horiz === "z") t.rotation.x = Math.PI / 2;
        if (horiz === "x") t.rotation.z = Math.PI / 2;
        t.position.set(x, y, z);
        t.castShadow = true;
        parent.add(t);
        return t;
      }
      // pared derecha: corrugados verticales
      [-1.5, -3, -4.5, -6, -7.5, -9].forEach((z) =>
        tubo(mTubE, H - 0.6, W / 2 - 0.1, H / 2 - 0.2, z, null),
      );
      [-2.2, -5.2, -8.2].forEach((z) =>
        tubo(mTubR, H - 0.6, W / 2 - 0.22, H / 2 - 0.2, z, null),
      );
      // pared fondo
      [-2.4, -0.8, 0.8, 2.4].forEach((x) =>
        tubo(mTubE, H - 0.6, x, H / 2 - 0.2, -D + 0.12, null),
      );
      [-1.6, 1.6].forEach((x) =>
        tubo(mTubR, H - 0.6, x, H / 2 - 0.2, -D + 0.24, null),
      );
      // pared izquierda (ligada al toggle de pared)
      [-2, -4, -6, -8, -9.8].forEach((z) =>
        tubo(mTubE, H - 0.6, -W / 2 + 0.1, H / 2 - 0.2, z, null, tubosL),
      );
      function syncIzq() {
        panelL.visible = wallL.visible;
        tubosL.visible = wallL.visible;
      }
      syncIzq();

      // ---------- bajantes existentes (como en la foto) ----------
      const bajantes = new THREE.Group();
      G.add(bajantes);
      const mPVC = new THREE.MeshStandardMaterial({
        color: 0x6f7276,
        roughness: 0.5,
        metalness: 0.4,
      });
      function pipe(r, len, x, y, z, horiz) {
        const t = new THREE.Mesh(
          new THREE.CylinderGeometry(r, r, len, 10),
          mPVC,
        );
        if (horiz === "z") t.rotation.x = Math.PI / 2;
        if (horiz === "x") t.rotation.z = Math.PI / 2;
        t.position.set(x, y, z);
        t.castShadow = true;
        bajantes.add(t);
      }
      function pipeBetween(r, a, b) {
        const d = new THREE.Vector3().subVectors(b, a);
        const t = new THREE.Mesh(
          new THREE.CylinderGeometry(r, r, d.length(), 10),
          mPVC,
        );
        t.position.copy(a).lerp(b, 0.5);
        t.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          d.normalize(),
        );
        t.castShadow = true;
        bajantes.add(t);
      }
      pipe(0.09, H - 0.2, W / 2 - 0.24, (H - 0.2) / 2, -6.6, null); // bajante gris pared derecha (≈2/3 fondo)
      pipe(0.09, 2.4, W / 2 - 0.24, H - 0.35, -7.8, "z"); // su tramo horizontal por el techo hacia el fondo
      // red galvanizada: diagonales pegadas al forjado, en el plenum (entre techo y paneles de techo)
      const J = new THREE.Vector3(-3.35, H - 0.07, -5.75); // unión arriba, oculta por el falso techo
      pipeBetween(0.05, new THREE.Vector3(0.9, H - 0.05, -3.4), J);
      pipeBetween(0.05, new THREE.Vector3(1.7, H - 0.05, -6.0), J);
      pipeBetween(0.05, new THREE.Vector3(-1.0, H - 0.05, -1.6), J);
      pipe(0.06, H - 0.12, -3.4, (H - 0.12) / 2, -5.78, null); // bajante principal: por detrás del pilar, pegada a la esquina de la pared
      pipe(0.05, H - 0.2, 1.5, (H - 0.2) / 2, -D + 0.15, null); // bajante fina en la pared del fondo

      // ---------- techo técnico (10 cm) con paneles de luz ----------
      const mFalso = new THREE.MeshStandardMaterial({
        color: 0xf0ebe0,
        roughness: 0.9,
      });
      box(PIN * 2, 0.06, 10.55, mFalso, 0, H - 0.13, -5.325, paneles);
      const mLED = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xfff1d8,
        emissiveIntensity: 1.15,
      });
      [-1.7, 1.7].forEach((x) =>
        [-1.6, -4.1, -6.6, -9.1].forEach((z) =>
          box(1.2, 0.04, 0.6, mLED, x, H - 0.17, z, paneles),
        ),
      );

      // ---------- fachada: puerta 0,75×2 + machón 30 cm + cristalera ----------
      const fachada = new THREE.Group();
      G.add(fachada);
      const mDoor = new THREE.MeshStandardMaterial({
        color: 0x4a443c,
        roughness: 0.6,
        metalness: 0.3,
      });
      const mGlassF = new THREE.MeshStandardMaterial({
        color: 0xbfe0e4,
        transparent: true,
        opacity: 0.16,
        roughness: 0.05,
      });
      const mBrickF = mBrick(2, 1.2);
      box(W, CALLE, 0.18, mConc, 0, CALLE / 2, 0, fachada); // murete bajo calle (cierra trastero)
      box(0.3, 2.2, 0.18, mBrickF, -3.35, CALLE + 1.1, 0, fachada); // jamba izquierda
      box(1.4, 2, 0.08, mDoor, -2.5, CALLE + 1, 0, fachada); // puerta 1,4 × 2
      box(1.4, 0.2, 0.04, mGlassF, -2.5, CALLE + 2.1, 0, fachada); // fijo sobre puerta
      box(0.3, 2.2, 0.18, mBrickF, -1.65, CALLE + 1.1, 0, fachada); // machón 30 cm
      box(5.0, 2.2, 0.04, mGlassF, 1.0, CALLE + 1.1, 0, fachada); // cristalera
      [-0.25, 1.0, 2.25].forEach((x) =>
        box(0.06, 2.2, 0.1, mRail, x, CALLE + 1.1, 0, fachada),
      ); // montantes
      box(
        W,
        H - CALLE - 2.2,
        0.18,
        mBrickF,
        0,
        (H + CALLE + 2.2) / 2,
        0,
        fachada,
      ); // banda superior
      // calle exterior (referencia de nivel)
      box(
        W + 2,
        0.2,
        2.4,
        new THREE.MeshStandardMaterial({ color: 0x8e8a82, roughness: 1 }),
        0,
        CALLE - 0.1,
        1.2,
      );

      // ---------- forjados nuevos ----------
      // planta entrada (nivel calle) con hueco de escalera a la izquierda
      box(5.5, GR, -MID, mConcN, 0.75, CALLE - GR / 2, MID / 2);
      box(1.5, GR, 3.3, mConcN, -2.75, CALLE - GR / 2, -1.65);
      box(W, GR, D + MID, mConcN, 0, MEZZ - GR / 2, (MID - D) / 2); // planta nueva +1,2 m

      // ---------- escaleras flotantes (peldaños en voladizo desde la pared) ----------
      function stair(side, yTop, yBot, z0, dir) {
        // side: -1 izq, 1 dcha · dir: sentido z por peldaño
        const total = yTop - yBot,
          n = Math.round(total / 0.175),
          rise = total / n,
          run = 0.28,
          wTr = 0.95;
        for (let i = 1; i <= n - 1; i++) {
          const y = yTop - i * rise,
            z = z0 + dir * i * run;
          box(
            wTr,
            0.07,
            run - 0.02,
            mStep,
            side * (PIN - wTr / 2),
            y - 0.035,
            z,
          );
          box(0.05, 0.12, run - 0.06, mRail, side * (PIN - 0.02), y - 0.1, z); // anclaje al panel
        }
      }
      stair(-1, CALLE, 0, -3.35, -1); // izquierda: baja por el hueco, llega al fondo con altura libre
      stair(1, MEZZ, CALLE, MID + 0.1, 1); // derecha: sube hacia el borde de la planta nueva

      // ---------- barandillas de vidrio (ocultas por defecto, botón Vidrios) ----------
      const vidrios = new THREE.Group();
      vidrios.visible = false;
      G.add(vidrios);
      function railing(x0, x1, y, z) {
        const len = x1 - x0;
        box(len, 0.95, 0.03, mGlass, (x0 + x1) / 2, y + 0.5, z, vidrios);
        box(len, 0.05, 0.06, mRail, (x0 + x1) / 2, y + 1.0, z, vidrios);
      }
      railing(-1.9, W / 2 - 1.4, CALLE, MID + 0.02); // borde planta entrada (hueco dcha = subida)
      railing(-3.05, W / 2 - 1.4, MEZZ, MID - 0.02); // borde planta nueva (hueco dcha = llegada)
      // barandilla lateral del hueco de bajada
      box(0.03, 0.95, 2.2, mGlass, -1.95, CALLE + 0.5, -4.4, vidrios);
      box(0.06, 0.05, 2.2, mRail, -1.95, CALLE + 1.0, -4.4, vidrios);

      // ---------- figura humana 1,75 m (escala) ----------
      function person(x, y, z) {
        const p = new THREE.Group();
        const mP = new THREE.MeshStandardMaterial({
          color: 0x37322c,
          roughness: 0.8,
        });
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.13, 1.05, 12),
          mP,
        );
        body.position.y = 0.95;
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.115, 12, 12),
          mP,
        );
        head.position.y = 1.62;
        const legs = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.09, 0.45, 10),
          mP,
        );
        legs.position.y = 0.22;
        p.add(body, head, legs);
        p.position.set(x, y, z);
        p.traverse((o) => {
          o.castShadow = true;
        });
        G.add(p);
        return p;
      }
      person(-0.8, CALLE, -2.2); // en la entrada
      person(0.7, MEZZ, -8); // en la planta nueva
      person(-0.6, 0, -8.5); // en la sala del fondo

      // ---------- etiquetas ----------
      const labels = [];
      function label(txt, x, y, z, small) {
        const s = small ? 0.7 : 1;
        const cv = document.createElement("canvas");
        cv.width = 512;
        cv.height = 128;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "rgba(18,16,14,.85)";
        ctx.beginPath();
        ctx.roundRect(6, 18, 500, 92, 46);
        ctx.fill();
        ctx.strokeStyle = "#8fd14f";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = "#f2ecdf";
        ctx.font = "600 44px -apple-system,Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(txt, 256, 66);
        const t = new THREE.CanvasTexture(cv);
        const sp = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: t, depthTest: false }),
        );
        sp.scale.set(2.3 * s, 0.58 * s, 1);
        sp.position.set(x, y, z);
        G.add(sp);
        labels.push(sp);
      }
      label("Entrada · nivel calle", 0, CALLE + 0.85, -1.4);
      label("Planta nueva ~ 2,4 m", 0, MEZZ + 0.85, -8.2);
      label("Sala fondo ~ 2,4 m", 0, 1.3, -9.6);
      label("Trastero · h 1,3 m", 0, 0.62, -3.4, true);

      // ---------- luces ----------
      scene.add(new THREE.HemisphereLight(0xfff4e0, 0x33302b, 0.55));
      const sun = new THREE.DirectionalLight(0xfff0d8, 1.1);
      sun.position.set(4, 7, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -8;
      sun.shadow.camera.right = 8;
      sun.shadow.camera.top = 9;
      sun.shadow.camera.bottom = -3;
      scene.add(sun);
      [
        [0, 4.3, -3],
        [0, 4.3, -8.5],
        [0, 2.1, -8.5],
      ].forEach((p) => {
        const l = new THREE.PointLight(0xffe7c4, 0.5, 9);
        l.position.set(...p);
        scene.add(l);
      });

      // ---------- cámara orbital táctil ----------
      const ctrl = {
        target: new THREE.Vector3(0, 2.2, -5),
        theta: 0,
        phi: 1.25,
        r: 13.5,
      };
      function applyCam() {
        const { target: t, theta, phi, r } = ctrl;
        cam.position.set(
          t.x + r * Math.sin(phi) * Math.sin(theta),
          t.y + r * Math.cos(phi),
          t.z + r * Math.sin(phi) * Math.cos(theta),
        );
        cam.lookAt(t);
      }
      const ptrs = new Map();
      let pd = 0;
      canvas.addEventListener("pointerdown", (e) => {
        ptrs.set(e.pointerId, [e.clientX, e.clientY]);
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!ptrs.has(e.pointerId)) return;
        const prev = ptrs.get(e.pointerId);
        ptrs.set(e.pointerId, [e.clientX, e.clientY]);
        const dx = e.clientX - prev[0],
          dy = e.clientY - prev[1];
        if (ptrs.size === 1) {
          if (walk.on) {
            walk.yaw -= dx * 0.0045;
            walk.pitch = Math.min(1.2, Math.max(-1.2, walk.pitch - dy * 0.003));
          } else {
            ctrl.theta -= dx * 0.006;
            ctrl.phi = Math.min(1.65, Math.max(0.15, ctrl.phi - dy * 0.005));
          }
        } else if (ptrs.size === 2 && !walk.on) {
          const a = [...ptrs.values()],
            d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
          if (pd) ctrl.r = Math.min(24, Math.max(2.5, (ctrl.r * pd) / d));
          pd = d;
        }
        hint();
      });
      const up = (e) => {
        ptrs.delete(e.pointerId);
        pd = 0;
      };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          ctrl.r = Math.min(24, Math.max(2.5, ctrl.r * (1 + e.deltaY * 0.001)));
          hint();
        },
        { passive: false },
      );
      let hinted = false;
      function hint() {
        if (!hinted) {
          hinted = true;
          document.getElementById("hint").style.opacity = 0;
        }
      }

      // ---------- modo paseo (primera persona, ojos a 1,70 m) ----------
      const walk = {
        on: false,
        pos: new THREE.Vector3(0, CALLE, -0.8),
        yaw: 0,
        pitch: -0.05,
        v: [0, 0],
      };
      const joy = document.getElementById("joy"),
        knob = document.getElementById("knob");
      let joyId = null;
      function jmove(e) {
        const r = joy.getBoundingClientRect();
        let dx = (e.clientX - r.left - 55) / 40,
          dy = (e.clientY - r.top - 55) / 40;
        const m = Math.hypot(dx, dy);
        if (m > 1) {
          dx /= m;
          dy /= m;
        }
        walk.v = [dx, -dy];
        knob.style.left = 35 + dx * 32 + "px";
        knob.style.top = 35 + dy * 32 + "px";
      }
      joy.addEventListener("pointerdown", (e) => {
        joyId = e.pointerId;
        joy.setPointerCapture(e.pointerId);
        jmove(e);
      });
      joy.addEventListener("pointermove", (e) => {
        if (e.pointerId === joyId) jmove(e);
      });
      const jEnd = (e) => {
        if (e.pointerId === joyId) {
          joyId = null;
          walk.v = [0, 0];
          knob.style.left = "35px";
          knob.style.top = "35px";
        }
      };
      joy.addEventListener("pointerup", jEnd);
      joy.addEventListener("pointercancel", jEnd);
      const keys = {};
      addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = 1));
      addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = 0));
      function floorAt(x, z, cur) {
        if (x < -1.95 && z < -3.3 && z > -5.5)
          return Math.max(0, Math.min(CALLE, (CALLE * (z + 5.4)) / 1.95)); // rampa escalera bajada
        if (x > 1.95 && z < -3.5 && z > -5.5)
          return Math.max(
            CALLE,
            Math.min(MEZZ, CALLE + 1.2 * ((-3.6 - z) / 1.85)),
          ); // rampa escalera subida
        if (z >= -5.5) return CALLE; // entrada / calle
        return cur > 1.9 ? MEZZ : 0; // fondo: planta alta o sala baja
      }
      function stepWalk(dt) {
        let vx = walk.v[0],
          vz = walk.v[1];
        if (joyId === null) {
          vx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
          vz = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
        }
        const sp = 2.6 * dt;
        const f = new THREE.Vector3(
          -Math.sin(walk.yaw),
          0,
          -Math.cos(walk.yaw),
        );
        const r = new THREE.Vector3(-f.z, 0, f.x);
        walk.pos.addScaledVector(f, vz * sp).addScaledVector(r, vx * sp);
        walk.pos.x = Math.max(-PIN + 0.3, Math.min(PIN - 0.3, walk.pos.x));
        walk.pos.z = Math.max(-D + 0.5, Math.min(2.5, walk.pos.z));
        const fy = floorAt(walk.pos.x, walk.pos.z, walk.pos.y);
        walk.pos.y += (fy - walk.pos.y) * Math.min(1, dt * 9);
        cam.position.set(walk.pos.x, walk.pos.y + 1.7, walk.pos.z);
        cam.lookAt(
          cam.position.x - Math.sin(walk.yaw) * Math.cos(walk.pitch),
          cam.position.y + Math.sin(walk.pitch),
          cam.position.z - Math.cos(walk.yaw) * Math.cos(walk.pitch),
        );
      }

      // ---------- vistas ----------
      let anim = null;
      function goTo(t, theta, phi, r) {
        const s = { ...ctrl, target: ctrl.target.clone() },
          k0 = performance.now();
        anim = (now) => {
          const k = Math.min(1, (now - k0) / 700),
            e = 1 - Math.pow(1 - k, 3);
          ctrl.target.lerpVectors(s.target, t, e);
          ctrl.theta = s.theta + (theta - s.theta) * e;
          ctrl.phi = s.phi + (phi - s.phi) * e;
          ctrl.r = s.r + (r - s.r) * e;
          if (k >= 1) anim = null;
        };
      }
      const B = {
        bGen: document.getElementById("bGen"),
        bWalk: document.getElementById("bWalk"),
        bSec: document.getElementById("bSec"),
        bWall: document.getElementById("bWall"),
        bPan: document.getElementById("bPan"),
        bVid: document.getElementById("bVid"),
        bFac: document.getElementById("bFac"),
        bBaj: document.getElementById("bBaj"),
        bTub: document.getElementById("bTub"),
        bLab: document.getElementById("bLab"),
      };
      function setOn(id) {
        ["bGen", "bSec"].forEach((k) => B[k].classList.toggle("on", k === id));
      }
      function exitWalk() {
        walk.on = false;
        joy.style.display = "none";
        B.bWalk.classList.remove("on");
      }
      B.bGen.onclick = () => {
        exitWalk();
        setOn("bGen");
        goTo(new THREE.Vector3(0, 2.2, -5), 0, 1.25, 13.5);
      };
      B.bSec.onclick = () => {
        exitWalk();
        setOn("bSec");
        goTo(new THREE.Vector3(0, 2.2, -5.5), -1.45, 1.25, 11);
      };
      B.bWalk.onclick = () => {
        walk.on = !walk.on;
        B.bWalk.classList.toggle("on", walk.on);
        joy.style.display = walk.on ? "block" : "none";
        if (walk.on) {
          anim = null;
          setOn("");
          walk.pos.set(0, CALLE, -0.8);
          walk.yaw = 0;
          walk.pitch = -0.05;
          const h = document.getElementById("hint");
          h.textContent =
            "Joystick: andar · arrastrar pantalla: mirar · (PC: WASD)";
          h.style.opacity = 1;
          setTimeout(() => (h.style.opacity = 0), 3500);
        }
      };
      B.bWall.onclick = () => {
        wallL.visible = !wallL.visible;
        syncIzq();
        B.bWall.classList.toggle("on", wallL.visible);
      };
      B.bPan.onclick = () => {
        paneles.visible = !paneles.visible;
        B.bPan.classList.toggle("on", paneles.visible);
      };
      B.bFac.onclick = () => {
        fachada.visible = !fachada.visible;
        B.bFac.classList.toggle("on", fachada.visible);
      };
      B.bBaj.onclick = () => {
        bajantes.visible = !bajantes.visible;
        B.bBaj.classList.toggle("on", bajantes.visible);
      };
      B.bTub.onclick = () => {
        tubos.visible = !tubos.visible;
        B.bTub.classList.toggle("on", tubos.visible);
      };
      B.bVid.onclick = () => {
        vidrios.visible = !vidrios.visible;
        B.bVid.classList.toggle("on", vidrios.visible);
      };
      B.bLab.onclick = () => {
        const v = !labels[0].visible;
        labels.forEach((l) => (l.visible = v));
        B.bLab.classList.toggle("on", v);
      };

      // ---------- bucle ----------
      function resize() {
        const w = innerWidth,
          h = innerHeight;
        renderer.setSize(w, h, false);
        cam.aspect = w / h;
        cam.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();
      let prevT = 0;
      renderer.setAnimationLoop((now) => {
        const dt = Math.min(0.05, (now - prevT || 16) / 1000);
        prevT = now;
        if (anim) anim(now);
        if (walk.on) stepWalk(dt);
        else applyCam();
        renderer.render(scene, cam);
      });
    </script>
  </body>
</html>
