<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e7e4de" />
    <title>Propuesta de reforma del local</title>
  </head>
  <body>
    <div id="visor"></div>

    <details class="panel ficha" id="ficha" open>
      <summary>
        <p class="antetitulo">Propuesta de reforma</p>
        <h1 id="nombre">Local</h1>
      </summary>
      <dl id="datos"></dl>
    </details>

    <nav class="panel segmentado modos" aria-label="Qué mostrar">
      <button type="button" data-modo="actual">Estado actual</button>
      <button type="button" data-modo="propuesta">Propuesta</button>
      <button type="button" data-modo="comparar">Comparar</button>
    </nav>

    <div id="comparador" hidden>
      <div class="divisor" role="separator" aria-label="Arrastra para comparar"><span></span></div>
      <span class="lado izquierdo">Estado actual</span>
      <span class="lado derecho">Propuesta</span>
    </div>

    <footer class="barra">
      <p id="ayuda"></p>
      <nav class="panel herramientas" aria-label="Vista">
        <div class="segmentado">
          <button type="button" data-vista="maqueta">Maqueta</button>
          <button type="button" data-vista="planta">Planta</button>
          <button type="button" data-vista="recorrido">Recorrido</button>
        </div>
        <span class="separador"></span>
        <button type="button" id="btn-cotas" class="suelto">Cotas</button>
        <button type="button" id="btn-estructura" class="suelto" title="Ver la estructura metálica bajo la tarima">Estructura</button>
        <button type="button" id="btn-captura" class="suelto">Captura</button>
      </nav>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
